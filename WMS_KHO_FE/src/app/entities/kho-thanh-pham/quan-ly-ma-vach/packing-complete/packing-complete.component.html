<div class="packing-complete-container">
  <div class="pallet-header">
    <div class="qr-code">
      <div class="qr-placeholder"></div>
    </div>
    <div class="pallet-info">
      <div class="pallet-title">
        <span>Pallet:</span>
        <span class="pallet-id">{{ palletId }}</span>
      </div>
      <div class="pallet-stats">
        <span class="stat-label">Tổng số lượng:</span>
        <span class="stat-value">{{ totalCases }} cái</span>
        <span class="divider">|</span>
        <span class="stat-label">Thùng:</span>
        <span class="stat-value">{{ totalBoxes }}</span>
      </div>
    </div>
  </div>

  <div class="complete-content">
    <div class="scan-section">
      <div class="section-header">
        <span class="section-icon">📦</span>
        <h3>Quét mã thùng</h3>
      </div>

      <div class="scan-input-wrapper">
        <div class="scan-icon-small">
          <div class="corner-small tl"></div>
          <div class="corner-small tr"></div>
          <div class="corner-small bl"></div>
          <div class="corner-small br"></div>
        </div>
        <div class="scan-input-disabled">
          <input disabled placeholder="Scan mã thùng...">
        </div>
      </div>

      <div class="scan-actions">
        <button mat-raised-button class="scan-btn" disabled>
          Tách thùng
        </button>
        <button mat-icon-button class="next-btn" disabled>
          <span class="arrow">→</span>
        </button>
      </div>
    </div>

    <div class="items-section">
      <div class="section-header">
        <span class="section-icon">📦</span>
        <h3>Danh sách thùng</h3>
      </div>

      <div class="items-list">
        <div class="item-card" *ngFor="let item of packageItems">
          <div class="item-info">
            <div class="item-barcode">{{ item.barcode }}</div>
            <div class="item-details">
              <span class="item-label">Sản phẩm:</span>
              <span class="item-name">{{ item.productName }}</span>
            </div>
            <div class="item-quantity">
              <span class="quantity-label">Số lượng tách:</span>
              <span class="quantity-value">{{ item.stackQuantity }} cái</span>
            </div>
          </div>
          <button mat-icon-button class="remove-btn" disabled>
            <span class="close-icon">✕</span>
          </button>
        </div>
      </div>

      <button 
        mat-raised-button 
        class="new-packing-btn" 
        (click)="onNewPacking()">
        Tách mã mới
      </button>
    </div>
  </div>

  <div class="success-overlay">
    <div class="success-card">
      <div class="success-icon">
        <div class="checkmark">✓</div>
      </div>
      <h2 class="success-title">Hoàn thành!</h2>
      <p class="success-message">Đã tách mã thành công</p>
    </div>
  </div>
</div>
