<div class="page-wrapper">
  <!-- Header -->
  <div class="page-header">
    <div class="page-title-group">
      <span class="material-icons title-icon">open_with</span>
      <div class="title-text">
        <h1 class="page-title">Luân chuyển kho</h1>
        <span class="page-subtitle">External warehouse transfer</span>
      </div>
    </div>
  </div>

  <!-- Content -->
  <div class="page-content">
    <div class="cards-container">

      <!-- Card 1: Tạo đơn chuyển kho -->
      <div class="action-card" (click)="navigateToCreate()">
        <div class="card-icon-wrapper">
          <span class="material-icons card-icon">add_circle_outline</span>
        </div>
        <h2 class="card-title">Tạo đơn chuyển kho</h2>
        <p class="card-description">
          Lập phiếu yêu cầu chuyển hàng hóa giữa<br />
          các kho nội bộ hoặc các công ty con.
        </p>
        <div class="card-arrow">
          <span class="material-icons">chevron_right</span>
        </div>
      </div>

      <!-- Card 2: Phê duyệt đơn chuyển -->
      <div class="action-card" (click)="navigateToApprove()">
        <div class="card-icon-wrapper">
          <span class="material-icons card-icon">check</span>
        </div>
        <h2 class="card-title">Phê duyệt đơn chuyển</h2>
        <p class="card-description">
          Kiểm soát và xác nhận các lệnh điều<br />
          chuyển vật tư trong hệ thống.
        </p>
        <div class="card-arrow">
          <span class="material-icons">chevron_right</span>
        </div>
      </div>

    </div>
  </div>
</div>
